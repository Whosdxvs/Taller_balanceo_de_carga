global
    daemon
    maxconn 256

defaults
    mode http
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    option httplog

frontend http-in
    bind *:80
    acl is_api path_beg /api/
    acl is_stats path_beg /stats
    use_backend api_servers if is_api
    use_backend stats_backend if is_stats
    default_backend front_servers

backend front_servers
    server frontend frontend:3000

backend api_servers
    balance roundrobin
    option httpchk GET /api/hello
    server backend1 backend1:8000 check
    server backend2 backend2:8000 check
    server backend3 backend3:8000 check

backend stats_backend
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
